[project]
name = "seller-pulse"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Biswajit" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=0.2.0",
    "chromadb>=1.5.9",
    "gradio>=6.28.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
seller-pulse = "seller_pulse:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
